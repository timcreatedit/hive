name: hive_generator
description: Extension for Hive. Automatically generates TypeAdapters to store any class.
version: 1.1.2
homepage: https://github.com/hivedb/hive/tree/master/hive_generator
documentation: https://docs.hivedb.dev/

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: '>=10.0.0 <11.0.0'
  build: ^4.0.0
  dart_style: ^3.1.3
  source_gen: ^4.0.0
  hive: ^2.0.4
  source_helper: ^1.1.0

dev_dependencies:
  test: ^1.17.11
  build_test: any
  build_runner: any
  pedantic: ^1.11.1
